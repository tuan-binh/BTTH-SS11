spring.application.name=btth-ss11

# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_btth_ss11
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# logging
logging.file.name=logs/atm-service.log
logging.file.path=logs
# [Thời gian] - [Mức độ Log 5 ký tự] - [Tên luồng] - [Tên Class] - [Nội dung log].
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger - %msg%n
logging.pattern.level=%5p

logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7